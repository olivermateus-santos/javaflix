<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JavaFlix</title>

    <link rel="icon"
          type="image/png"
          href="img/java-logo.png">

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

<header>

    <div class="logo">

        <img src="img/java-logo.png"
             alt="Logo Java">

        <h1>JAVA<span>FLIX</span></h1>

    </div>

</header>

<main>

    <h2>Filmes disponíveis</h2>

    <section id="catalogo"
             class="catalogo">

    </section>

</main>

<div id="modal"
     class="modal">

    <div class="modal-conteudo">

        <button id="fechar-modal"
                class="fechar-modal"
                type="button">
            ×
        </button>

        <h2 id="modal-titulo"></h2>

        <p id="modal-genero"></p>

        <p id="modal-ano"></p>

        <p id="modal-duracao"></p>

        <p id="modal-classificacao"></p>

        <p id="modal-nota"></p>

        <p id="modal-plano"></p>

        <h3>Trilha sonora</h3>

        <div id="modal-trilha"></div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
